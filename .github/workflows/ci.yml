name: CI - Sustainable Materials Impact Platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check backend imports
        working-directory: Backend
        run: |
          python -c "from app.main import app; print('Backend import successful')"

  frontend-check:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm install

      - name: Build frontend
        working-directory: Frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - frontend-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build backend Docker image
        run: docker build -t material-impact-backend:test ./Backend

      - name: Build frontend Docker image
        run: docker build -t material-impact-frontend:test --build-arg VITE_API_URL=http://localhost:8000 ./Frontend