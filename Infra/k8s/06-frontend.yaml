apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: material-impact-frontend
  template:
    metadata:
      labels:
        app: material-impact-frontend
    spec:
      containers:
        - name: frontend
          image: material-impact-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: material-impact-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081